name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "pysheet/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "pysheet/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install sphinx-rtd-theme sphinx-copybutton

      - name: Build HTML docs (strict)
        run: |
          cd docs
          make html

      - name: Run doctests
        run: |
          cd docs
          make doctest

      - name: Check links
        run: |
          cd docs
          make linkcheck || echo "Link check warnings found"

      - name: Check coverage
        run: |
          cd docs
          make coverage

      - name: Build EPUB
        run: |
          cd docs
          make epub

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
