[project]
name = "pysheet"
version = "0.1.0"
description = "A vim-like TUI spreadsheet for the terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
full = [
    "xlrd>=2.0.0",
    "odfpy>=1.4.0",
    "plotext>=5.2.0",
    "requests>=2.31.0",
    "watchdog>=4.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=0.4",
    "hypothesis>=6.100",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
pysheet = "pysheet.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.envs.default]
features = ["full"]
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-textual-snapshot>=0.4",
    "hypothesis>=6.100",
    "coverage>=7.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.hatch.envs.default.scripts]
run = "pysheet {args}"
test = "pytest tests/unit tests/integration {args}"
test-e2e = "pytest tests/e2e {args}"
test-all = "pytest {args}"
lint = "ruff check pysheet tests"
typecheck = "mypy pysheet"
cov = "coverage run -m pytest tests/unit tests/integration && coverage report"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
